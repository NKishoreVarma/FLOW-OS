apiVersion: v1
kind: Service
metadata:
  name: flow-os
  namespace: flow-os
  labels:
    app: flow-os
    component: api
spec:
  selector:
    app: flow-os
    component: api
  ports:
    - name:       http
      port:       80
      targetPort: 5001
      protocol:   TCP
    - name:       https
      port:       443
      targetPort: 5001
      protocol:   TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: flow-os-metrics
  namespace: flow-os
  labels:
    app: flow-os
    component: metrics
spec:
  selector:
    app: flow-os
    component: api
  ports:
    - name:       metrics
      port:       9090
      targetPort: 5001
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flow-os-pdb
  namespace: flow-os
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: flow-os
      component: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flow-os-hpa
  namespace: flow-os
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       flow-os-app
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type:               Utilization
          averageUtilization: 80
