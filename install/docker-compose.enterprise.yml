version: "3.9"

# FLOW OS Enterprise — Production Docker Compose
# Runs: app (3 replicas), worker, PostgreSQL+pgvector, Redis Cluster, nginx load balancer

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:-postgresql://flow:flowpass@postgres:5432/flowdb}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  JWT_SECRET: ${JWT_SECRET}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  PORT: 5001
  VAULT_ROOT: /data/vaults
  REPORT_ROOT: /data/reports
  LOG_SINK: stdout
  LOG_FORMAT: json
  WS_AUTH_REQUIRED: "true"
  CORS_ORIGIN: ${CORS_ORIGIN:-https://app.example.com}
  MIN_REPLICAS: "3"
  MAX_REPLICAS: "20"
  QUEUE_SHARDS: "4"

services:
  # ── API Nodes ────────────────────────────────────────────────────────────────
  app:
    image: flow-os:${VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    environment:
      <<: *app-env
    volumes:
      - vault_data:/data/vaults
      - report_data:/data/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5001/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal
      - frontend

  # ── Background Workers ────────────────────────────────────────────────────────
  worker:
    image: flow-os:${VERSION:-latest}
    command: node src/workers/workerEntry.js
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1"
          memory: 1G
    environment:
      <<: *app-env
      WORKER_ONLY: "true"
    volumes:
      - vault_data:/data/vaults
    depends_on:
      - postgres
      - redis
    networks:
      - internal

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: flowdb
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flowdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    networks:
      - internal

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory ${REDIS_MAX_MEM:-2gb}
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    networks:
      - internal

  # ── Nginx Load Balancer ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./install/nginx/nginx.enterprise.conf:/etc/nginx/nginx.conf:ro
      - ./install/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - frontend
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pg_data:    { driver: local }
  redis_data: { driver: local }
  vault_data: { driver: local }
  report_data: { driver: local }

networks:
  internal:  { driver: overlay, internal: true }
  frontend:  { driver: overlay }
